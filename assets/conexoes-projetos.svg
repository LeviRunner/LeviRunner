    <style><![CDATA[
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .ui   { font-family: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }

      /* cores fixas ficam em atributos de apresentacao: o auto dark mode do
         navegador inverte cores declaradas em CSS, mas nao atributos. Aqui
         so ficam as propriedades animadas. */

      /* ciclo de 28.8s : base1 -> base2 -> base3 -> base1 */
      .t1   { animation: on1   28.8s linear infinite; }
      .t2   { animation: on2   28.8s linear infinite; }
      .t3   { animation: on3   28.8s linear infinite; }
      .t12  { animation: on12  28.8s linear infinite; }
      .t13  { animation: on13  28.8s linear infinite; }
      .t123 { animation: on123 28.8s linear infinite; }
      @keyframes on1   { 0%,19%{opacity:1;color:#3fb950} 21%,90%{opacity:.3;color:#30363d} 94%,100%{opacity:1;color:#3fb950} }
      @keyframes on2   { 0%,26%{opacity:.3;color:#30363d} 31%,46%{opacity:1;color:#58a6ff} 48%,100%{opacity:.3;color:#30363d} }
      @keyframes on3   { 0%,53%{opacity:.3;color:#30363d} 58%,73%{opacity:1;color:#f85149} 75%,100%{opacity:.3;color:#30363d} }
      @keyframes on12  { 0%,19%{opacity:1;color:#3fb950} 21%,26%{opacity:.3;color:#30363d} 31%,46%{opacity:1;color:#58a6ff} 48%,90%{opacity:.3;color:#30363d} 94%,100%{opacity:1;color:#3fb950} }
      @keyframes on13  { 0%,19%{opacity:1;color:#3fb950} 21%,53%{opacity:.3;color:#30363d} 58%,73%{opacity:1;color:#f85149} 75%,90%{opacity:.3;color:#30363d} 94%,100%{opacity:1;color:#3fb950} }
      @keyframes on123 { 0%,19%{opacity:1;color:#3fb950} 21%,26%{opacity:.3;color:#30363d} 31%,46%{opacity:1;color:#58a6ff} 48%,53%{opacity:.3;color:#30363d} 58%,73%{opacity:1;color:#f85149} 75%,90%{opacity:.3;color:#30363d} 94%,100%{opacity:1;color:#3fb950} }

      .b1 { animation: lit1 28.8s linear infinite; }
      .b2 { animation: lit2 28.8s linear infinite; }
      .b3 { animation: lit3 28.8s linear infinite; }
      @keyframes lit1 { 0%,19%{opacity:1;color:#3fb950} 21%,90%{opacity:.5;color:#30363d} 94%,100%{opacity:1;color:#3fb950} }
      @keyframes lit2 { 0%,26%{opacity:.5;color:#30363d} 31%,46%{opacity:1;color:#58a6ff} 48%,100%{opacity:.5;color:#30363d} }
      @keyframes lit3 { 0%,53%{opacity:.5;color:#30363d} 58%,73%{opacity:1;color:#f85149} 75%,100%{opacity:.5;color:#30363d} }


